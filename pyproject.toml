[project]
name = "retrieval-lens"
version = "0.1.0"
description = "Evaluate RAG systems on retrieval relevance, answer accuracy, faithfulness, citation support and claim-level grounding."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "scikit-learn>=1.9.1",
    "typer>=0.27.3",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
rag-eval = "rag_quality_evaluator.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.uv.build-backend]
module-name = "rag_quality_evaluator"

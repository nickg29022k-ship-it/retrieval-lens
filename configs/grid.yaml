# Experiment grid: every chunker x retriever x k combination is evaluated.
chunkers:
  fixed:
    size: 50       # words per window
    overlap: 10    # words shared between consecutive windows
  sentence:
    max_words: 50  # pack whole sentences up to this many words
  heading:
    max_words: 120 # sections longer than this are split by paragraph
retrievers:
  - bm25
  - tfidf
  # - embed       # needs --embed-backend ollama (or mock for the hashing stand-in)
k: [1, 3, 5]
